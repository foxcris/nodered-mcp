name: build-image

# Baut das nodered-mcp-Image (ljmerza/nodered-mcp via PyPI), scannt es mit
# Trivy (CRITICAL/HIGH = fail) und pusht nach ghcr.io/<repo-owner>/nodered-mcp.
# Laufend woechentlich (Mo 04:00 UTC) + bei Push auf Dockerfile/requirements.
# Im ansible-setup-Repo aktualisisert watchtower auf home2 den Container
# automatisch per Digest (label com.centurylinklabs.watchtower.enable).
#
# Debugging ohne Log-Zugriff: bei Fail wird auf den Branch ci/trivy-report
# gepusht: trivy-image-report.json (Trivy-Findings) + run-status.json
# (Outcome jedes Steps). Ausserdem erscheinen Trivy-Findings als Annotations
# auf der Run-Seite.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build-mcp-nodered.yml"
      - ".trivyignore"

permissions:
  contents: write   # write nur fuer den trivy-report-Branch
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: co
        uses: actions/checkout@v6

      - name: Docker buildx setup
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        id: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (lokal im runner, mit gha cache)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nodered-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install trivy (gepinnt)
        id: trivyinstall
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Trivy image scan (JSON-Report)
        id: report
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --format json --output trivy-image-report.json nodered-mcp:ci || true

      - name: Trivy image scan (Annotations)
        id: annotate
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --format template --template "@contrib/github.tmpl" nodered-mcp:ci || true

      - name: Trivy image scan (CRITICAL/HIGH fail)
        id: gate
        run: |
          trivy --version
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 --format table nodered-mcp:ci

      - name: Trivy fs scan (repo)
        id: fsscan
        run: |
          trivy fs --scan-type vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 --format table .

      - name: Upload trivy report (artefakt)
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-image-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Push nach ghcr.io (latest + sha)
        id: push
        run: |
          docker tag nodered-mcp:ci ghcr.io/${{ github.repository_owner }}/nodered-mcp:latest
          docker tag nodered-mcp:ci ghcr.io/${{ github.repository_owner }}/nodered-mcp:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/nodered-mcp:latest
          docker push ghcr.io/${{ github.repository_owner }}/nodered-mcp:${{ github.sha }}

      - name: Run-Status + Reports auf Branch ci/trivy-report pushen
        id: reportpush
        if: always()
        run: |
          echo "{\"job\":\"${{ job.status }}\",\"co\":\"${{ steps.co.outcome }}\",\"buildx\":\"${{ steps.buildx.outcome }}\",\"login\":\"${{ steps.login.outcome }}\",\"build\":\"${{ steps.build.outcome }}\",\"trivyinstall\":\"${{ steps.trivyinstall.outcome }}\",\"report\":\"${{ steps.report.outcome }}\",\"annotate\":\"${{ steps.annotate.outcome }}\",\"gate\":\"${{ steps.gate.outcome }}\",\"fsscan\":\"${{ steps.fsscan.outcome }}\",\"artifact\":\"${{ steps.artifact.outcome }}\",\"push\":\"${{ steps.push.outcome }}\"}" > run-status.json
          [ -f trivy-image-report.json ] || echo '{}' > trivy-image-report.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/trivy-report
          git add run-status.json trivy-image-report.json
          git commit -m "run status $(date -u +%FT%TZ)" || true
          git push --force origin ci/trivy-report
