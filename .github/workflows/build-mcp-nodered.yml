name: build-image

# Baut das nodered-mcp-Image (ljmerza/nodered-mcp via PyPI), scannt es mit
# Trivy (CRITICAL/HIGH = fail) und pusht nach ghcr.io/<repo-owner>/nodered-mcp.
# Laufend woechentlich (Mo 04:00 UTC) + bei Push auf Dockerfile/requirements.
# Im ansible-setup-Repo aktualisisert watchtower auf home2 den Container
# automatisch per Digest (label com.centurylinklabs.watchtower.enable).
#
# Bei einem Trivy-Fail wird der JSON-Report zusaetzlich auf den Branch
# ci/trivy-report committet (lesbar via raw.githubusercontent.com) und als
# Workflow-Artefakt hochgeladen. Ausserdem werden die Findings als
# GitHub-Annotations ausgegeben (sichtbar auf der Run-Seite).

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build-mcp-nodered.yml"
      - ".trivyignore"

permissions:
  contents: write   # write nur fuer den trivy-report-Branch bei Fail
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker buildx setup
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (lokal im runner, mit gha cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nodered-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install trivy (gepinnt)
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Trivy image scan (JSON-Report)
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --format json --output trivy-image-report.json nodered-mcp:ci || true

      - name: Trivy image scan (Annotations)
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --format template --template "@contrib/github.tmpl" nodered-mcp:ci || true

      - name: Trivy image scan (CRITICAL/HIGH fail)
        run: |
          trivy --version
          echo "--- .trivyignore ---"; cat .trivyignore
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 --format table nodered-mcp:ci

      - name: Trivy fs scan (pip requirements)
        run: |
          trivy fs --scan-type vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 --format table .

      - name: Upload trivy report (artefakt)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-image-report.json
          retention-days: 14

      - name: Trivy-Report auf Branch ci/trivy-report pushen (bei Fail)
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/trivy-report
          [ -f trivy-image-report.json ] && git add trivy-image-report.json || echo '{}' > trivy-image-report.json && git add trivy-image-report.json
          git commit -m "trivy report $(date -u +%FT%TZ)" || true
          git push --force origin ci/trivy-report

      - name: Push nach ghcr.io (latest + sha)
        run: |
          docker tag nodered-mcp:ci ghcr.io/${{ github.repository_owner }}/nodered-mcp:latest
          docker tag nodered-mcp:ci ghcr.io/${{ github.repository_owner }}/nodered-mcp:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/nodered-mcp:latest
          docker push ghcr.io/${{ github.repository_owner }}/nodered-mcp:${{ github.sha }}
